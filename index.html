<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess Who - Custom Game Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], arabic: ['Cairo', 'sans-serif'] },
          colors: {
            slate: { 950: '#070a12', 900: '#0f172a', 800: '#1e293b' },
            gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', 'Cairo', sans-serif; background-color: #070a12; color: #f8fafc; }
    .glass-panel { background: rgba(19, 29, 51, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-between p-4 md:p-8">

  <div class="w-full max-w-4xl mx-auto">
    <!-- Header -->
    <header class="text-center mb-8">
      <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-gradient-to-tr from-amber-500 to-indigo-600 flex items-center justify-center text-3xl font-black text-white shadow-lg shadow-amber-500/20">
        🛠️
      </div>
      <h1 class="text-3xl md:text-5xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-amber-400 via-indigo-300 to-cyan-400">
        Guess Who Game Builder
      </h1>
      <p class="text-slate-400 text-sm md:text-base mt-2">Create custom interactive riddle games & share instantly via GitHub Pages.</p>
    </header>

    <!-- Metadata Form -->
    <div class="glass-panel rounded-3xl p-6 md:p-8 shadow-2xl mb-8 space-y-6">
      <h2 class="text-xl font-bold text-amber-400 flex items-center gap-2">⚙️ Game Configuration</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Game Title</label>
          <input type="text" id="game-title" value="Classroom Guess Who" placeholder="e.g. Office Trivia 2026" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-semibold focus:outline-none focus:border-amber-400" />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Game Subtitle</label>
          <input type="text" id="game-subtitle" value="Interactive Custom Edition" placeholder="e.g. Friends & Classmates" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-semibold focus:outline-none focus:border-amber-400" />
        </div>
      </div>
    </div>

    <!-- Riddles List Section -->
    <div class="glass-panel rounded-3xl p-6 md:p-8 shadow-2xl mb-8 space-y-6">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold text-amber-400 flex items-center gap-2">🧩 Game Riddles</h2>
        <button onclick="addRiddleForm()" class="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black rounded-xl text-xs uppercase tracking-wider transition">
          + Add Riddle
        </button>
      </div>

      <div id="riddles-container" class="space-y-6">
        <!-- Dynamic Riddle Cards Populated by JS -->
      </div>
    </div>

    <!-- Output & Export -->
    <div class="glass-panel rounded-3xl p-6 md:p-8 shadow-2xl text-center space-y-4">
      <button onclick="generateGameLink()" class="w-full py-4 bg-gradient-to-r from-amber-500 via-indigo-500 to-cyan-500 hover:opacity-90 text-slate-950 font-black text-xl rounded-2xl shadow-xl transition transform active:scale-98">
        🚀 Generate Playable Link
      </button>

      <div id="share-link-container" class="hidden mt-6 space-y-3">
        <label class="block text-xs font-bold uppercase text-emerald-400">Shareable Game Link Generated!</label>
        <div class="flex gap-2">
          <input type="text" id="share-url" readonly class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-amber-300 text-xs font-mono select-all focus:outline-none" />
          <button onclick="copyShareLink()" class="px-5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition text-sm">
            Copy
          </button>
        </div>
        <a id="launch-play-btn" target="_blank" href="#" class="inline-block mt-2 text-sm text-cyan-400 underline font-semibold hover:text-cyan-300">
          Open play.html directly ↗
        </a>
      </div>
    </div>
  </div>

  <footer class="mt-8 text-xs text-slate-500">
    Designed for GitHub Pages Dynamic Builder Workflow
  </footer>

  <script>
    let riddleCount = 0;

    const sampleData = [
      {
        name: "Sara",
        emoji: "🎨",
        titleEn: "The Creative Visionary",
        titleAr: "المبدعة الرائدة",
        riddleEn: "Angel from the outside, the opposite on the inside who am I?",
        riddleAr: "ملاك من الخارج، والعكس تماماً من الداخل. من أكون؟",
        hintEn: "She's silent in class",
        hintAr: "هادئة جداً في الصف."
      },
      {
        name: "Mahmoud",
        emoji: "⚽",
        titleEn: "The Athlete",
        titleAr: "الرياضي المميز",
        riddleEn: "Friendly by nature, dangerous when provoked. Who am I?",
        riddleAr: "ودود بطبعي، وخطير عند الاستفزاز. من أكون؟",
        hintEn: "He loves football.",
        hintAr: "يحب كرة القدم كثيراً."
      }
    ];

    window.onload = function() {
      sampleData.forEach(item => addRiddleForm(item));
    };

    function addRiddleForm(data = {}) {
      riddleCount++;
      const container = document.getElementById('riddles-container');

      const card = document.createElement('div');
      card.id = `riddle-card-${riddleCount}`;
      card.className = "bg-slate-900/90 border border-slate-800 rounded-2xl p-5 relative space-y-4";
      
      card.innerHTML = `
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
          <span class="text-xs font-black text-slate-400 uppercase">Riddle #${riddleCount}</span>
          <button onclick="removeRiddle(${riddleCount})" class="text-xs font-bold text-red-400 hover:text-red-300">✕ Remove</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Target Name</label>
            <input type="text" class="r-name w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm font-bold text-white" value="${data.name || ''}" placeholder="e.g. Alex" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Emoji Icon</label>
            <input type="text" class="r-emoji w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-center" value="${data.emoji || '🎭'}" placeholder="🎭" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Title Trait (EN)</label>
            <input type="text" class="r-title-en w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm" value="${data.titleEn || ''}" placeholder="e.g. Mastermind" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Riddle Text (English)</label>
            <textarea class="r-riddle-en w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white h-20">${data.riddleEn || ''}</textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Riddle Text (Arabic - Optional)</label>
            <textarea dir="rtl" class="r-riddle-ar w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white h-20">${data.riddleAr || ''}</textarea>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Hint (English)</label>
            <input type="text" class="r-hint-en w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs" value="${data.hintEn || ''}" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Hint (Arabic)</label>
            <input type="text" dir="rtl" class="r-hint-ar w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs" value="${data.hintAr || ''}" />
          </div>
        </div>
      `;

      container.appendChild(card);
    }

    function removeRiddle(id) {
      const el = document.getElementById(`riddle-card-${id}`);
      if (el) el.remove();
    }

    function generateGameLink() {
      const title = document.getElementById('game-title').value.trim() || "Custom Guess Who";
      const subtitle = document.getElementById('game-subtitle').value.trim() || "Dynamic Edition";

      const cards = document.querySelectorAll('#riddles-container > div');
      const riddles = [];

      cards.forEach((card, idx) => {
        const name = card.querySelector('.r-name').value.trim();
        if (!name) return;

        riddles.push({
          id: `r_${idx}_${Date.now()}`,
          name: name,
          emoji: card.querySelector('.r-emoji').value.trim() || '⭐',
          title: {
            en: card.querySelector('.r-title-en').value.trim() || "Classmate",
            ar: card.querySelector('.r-title-en').value.trim()
          },
          riddle: {
            en: card.querySelector('.r-riddle-en').value.trim(),
            ar: card.querySelector('.r-riddle-ar').value.trim() || card.querySelector('.r-riddle-en').value.trim()
          },
          hint: {
            en: card.querySelector('.r-hint-en').value.trim() || "No hint available",
            ar: card.querySelector('.r-hint-ar').value.trim() || "لا يوجد تلميح"
          }
        });
      });

      if (riddles.length === 0) {
        alert("Please add at least one riddle with a target name!");
        return;
      }

      const gameObject = { title, subtitle, riddles };
      const jsonStr = JSON.stringify(gameObject);
      const encodedData = encodeURIComponent(btoa(unescape(encodeURIComponent(jsonStr))));

      const playUrl = `${window.location.origin}${window.location.pathname.replace('index.html', '')}play.html?game=${encodedData}`;

      document.getElementById('share-url').value = playUrl;
      document.getElementById('launch-play-btn').href = playUrl;
      document.getElementById('share-link-container').classList.remove('hidden');
    }

    function copyShareLink() {
      const input = document.getElementById('share-url');
      input.select();
      navigator.clipboard.writeText(input.value);
      alert("Game link copied to clipboard!");
    }
  </script>
</body>
</html>
