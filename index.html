<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Custom Guess Who</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-4 md:p-8">
  <div class="max-w-4xl mx-auto glass-panel p-6 md:p-10 rounded-3xl border border-amber-500/30 bg-slate-900/50 shadow-2xl">
    <h1 class="text-4xl font-black text-amber-400 mb-2">Game Builder</h1>
    <p class="text-slate-400 mb-8">Design your own custom Guess Who game and generate a shareable link.</p>
    
    <!-- Game Meta Data & Settings -->
    <div class="space-y-6 mb-8 p-6 bg-slate-900 rounded-2xl border border-slate-700 shadow-xl">
      <h2 class="text-xl font-bold text-white mb-2">1. Main Information & Rules</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" id="game-title" placeholder="Game Title (e.g., Guess the Developer)" class="p-3 bg-slate-800 rounded-xl border border-slate-700 text-white focus:border-amber-400 focus:outline-none transition">
        <input type="text" id="game-subtitle" placeholder="Subtitle (e.g., Grade 9 Edition)" class="p-3 bg-slate-800 rounded-xl border border-slate-700 text-white focus:border-amber-400 focus:outline-none transition">
      </div>

      <!-- Victory Animation Customization -->
      <div>
        <label class="text-xs text-amber-400 uppercase font-bold mb-1 block">Custom Correct Answer Header / Gold Title</label>
        <input type="text" id="game-victory-title" placeholder="e.g., The One And Only or You Are CORRECT!" value="The One And Only" class="w-full p-3 bg-slate-800 rounded-xl border border-amber-500/50 text-amber-300 font-bold focus:border-amber-400 focus:outline-none transition">
        <p class="text-xs text-slate-500 mt-1">This animated title will display in shining gold above the correct answer when a player wins a riddle.</p>
      </div>

      <div class="pt-4 border-t border-slate-700 mt-4">
        <label class="flex items-center gap-3 text-white font-bold cursor-pointer mb-4">
          <input type="checkbox" id="setting-points" checked class="w-5 h-5 accent-amber-500 rounded">
          Enable Points System & Leaderboard
        </label>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-slate-400 uppercase font-bold mb-1 block">Hint Penalty (Points deducted)</label>
            <input type="number" step="0.1" id="setting-hint-penalty" value="0.5" class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 text-white focus:border-amber-400">
          </div>
          <div>
            <label class="text-xs text-slate-400 uppercase font-bold mb-1 block">Wrong Guess Penalty (Points deducted)</label>
            <input type="number" step="0.1" id="setting-wrong-penalty" value="0.5" class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 text-white focus:border-amber-400">
          </div>
        </div>
      </div>
    </div>

    <!-- Riddles Container -->
    <h2 class="text-xl font-bold text-white mb-4">2. Build Your Riddles</h2>
    <div id="riddles-container" class="space-y-6 mb-8"></div>

    <div class="flex flex-col md:flex-row gap-4 mb-4">
      <button onclick="addRiddleBlock()" class="flex-1 py-4 bg-slate-800 hover:bg-slate-700 rounded-xl text-amber-300 font-bold border border-slate-700 transition">
        + Add Another Riddle
      </button>
      <button id="generate-btn" onclick="generateGame()" class="flex-1 py-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-xl rounded-xl shadow-lg transition">
        Generate Unique Link 🚀
      </button>
    </div>

    <!-- Output Link -->
    <div id="link-output" class="hidden p-6 bg-emerald-900/30 border border-emerald-500/50 rounded-2xl text-center shadow-xl"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCph3KRkKFYMdPlwUviavHaZ9QngiKWGaU",
      authDomain: "riddle-701ae.firebaseapp.com",
      databaseURL: "https://riddle-701ae-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "riddle-701ae",
      storageBucket: "riddle-701ae.firebasestorage.app",
      messagingSenderId: "748642861259",
      appId: "1:748642861259:web:c016f007988340fc165b4e",
      measurementId: "G-SPXP0W5NDY"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function addRiddleBlock() {
      const container = document.getElementById('riddles-container');
      const index = container.children.length + 1;
      const html = `
        <div class="p-5 bg-slate-900 border border-slate-700 rounded-2xl riddle-block shadow-md relative">
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-black text-lg text-amber-400">Riddle ${index}</h3>
            ${index > 1 ? `<button onclick="this.parentElement.parentElement.remove()" class="text-red-400 hover:text-red-300 text-sm font-bold bg-red-900/30 px-3 py-1 rounded-lg">Remove ✕</button>` : ''}
          </div>
          <input type="text" class="r-question w-full p-3 mb-3 bg-slate-800 rounded-xl text-white border border-slate-700 focus:border-amber-400 focus:outline-none" placeholder="The Riddle / Question">
          <input type="text" class="r-hint w-full p-3 mb-3 bg-slate-800 rounded-xl text-white border border-slate-700 focus:border-amber-400 focus:outline-none" placeholder="The Hint">
          <input type="text" class="r-options w-full p-3 mb-3 bg-slate-800 rounded-xl text-white border border-slate-700 focus:border-amber-400 focus:outline-none" placeholder="Options for THIS riddle (Comma separated: Option 1, Option 2, Option 3)">
          <div class="grid grid-cols-2 gap-3">
            <input type="text" class="r-correct w-full p-3 bg-slate-800 rounded-xl text-white border border-slate-700 focus:border-amber-400 focus:outline-none" placeholder="Correct Answer (Exact match to one option)">
            <input type="text" class="r-emoji w-full p-3 bg-slate-800 rounded-xl text-white border border-slate-700 focus:border-amber-400 focus:outline-none" placeholder="Winning Emoji (e.g., 👑)">
          </div>
        </div>`;
      container.insertAdjacentHTML('beforeend', html);
    }

    addRiddleBlock();

    async function generateGame() {
      const btn = document.getElementById('generate-btn');
      btn.textContent = "Generating... ⏳";
      btn.disabled = true;

      try {
        const title = document.getElementById('game-title').value || "Guess Who";
        const subtitle = document.getElementById('game-subtitle').value || "Custom Edition";
        const victoryTitle = document.getElementById('game-victory-title').value || "The One And Only";
        
        const usePoints = document.getElementById('setting-points').checked;
        const hintPenalty = parseFloat(document.getElementById('setting-hint-penalty').value) || 0;
        const wrongPenalty = parseFloat(document.getElementById('setting-wrong-penalty').value) || 0;

        const blocks = document.querySelectorAll('.riddle-block');
        const customRiddles = [];

        blocks.forEach(block => {
          const rawOptions = block.querySelector('.r-options').value;
          customRiddles.push({
            riddleText: block.querySelector('.r-question').value,
            hintText: block.querySelector('.r-hint').value,
            options: rawOptions.split(',').map(s => s.trim()).filter(s => s !== ""),
            correctAnswer: block.querySelector('.r-correct').value.trim(),
            emoji: block.querySelector('.r-emoji').value || '🎉'
          });
        });

        const gameData = {
          title: title,
          subtitle: subtitle,
          victoryTitle: victoryTitle,
          settings: { usePoints, hintPenalty, wrongPenalty },
          riddles: customRiddles,
          createdAt: Date.now()
        };

        const newGameRef = db.ref('custom_games').push();
        await newGameRef.set(gameData);

        const uniqueId = newGameRef.key;
        const baseURL = window.location.href.replace('index.html', '').split('?')[0]; 
        const shareableLink = `${baseURL}play.html?id=${uniqueId}`;
        
        const linkDiv = document.getElementById('link-output');
        linkDiv.innerHTML = `
          <h3 class="text-emerald-400 font-black text-2xl mb-2">Game Created Successfully!</h3>
          <p class="text-slate-300 text-sm mb-4">Share this link with your friends to let them play:</p>
          <a href="${shareableLink}" target="_blank" class="block w-full p-4 bg-slate-900 border border-emerald-500/30 rounded-xl text-emerald-300 font-bold break-all hover:bg-slate-800 transition">${shareableLink}</a>
        `;
        linkDiv.classList.remove('hidden');

      } catch (error) {
        alert("Failed to create game. Error: " + error.message);
      } finally {
        btn.textContent = "Generate Unique Link 🚀";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
